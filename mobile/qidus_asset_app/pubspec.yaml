name: qidus_asset_app
description: QIDUS ASSET offline-first Android companion for Asset Management, QR scanning, Rapid Event Distribution, and Keystore-signed custody handovers.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.0
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  local_auth: ^2.3.0
  mobile_scanner: ^6.0.2
  path: ^1.9.0
  path_provider: ^2.1.4
  signature: ^5.5.0
  sqflite: ^2.3.3+1
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
